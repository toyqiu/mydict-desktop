[package]
name = "mydict-desktop"
version = "0.3.4"
description = "MyDict 的桌面查词器"
authors = ["toyqiuwu"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 移动端规范结构：主体编成库（Android 链接 staticlib/cdylib），main.rs 只是薄壳
name = "mydict_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 读系统剪贴板（桌面 + Android 通用）：移动端「打开即预填剪贴板里的词」
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls 而非 native-tls：局域网部署用的是明文 http，但自建服务常换 https，
# 用 rustls 免得依赖系统 openssl 版本（Windows 侧构建也少一个坑）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 桌面专属插件（全局热键/自启/单实例）——移动端没有这些能力，按目标门控，
# 避免污染 Android 构建
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# 单实例：二次启动把已有实例唤到前台后自行退出（注册须在所有插件之前）
tauri-plugin-single-instance = "2"

# Windows 剪贴板监听（Linux 走 xclip 子进程，不需要它；只要文本，关掉 image-data）
[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
