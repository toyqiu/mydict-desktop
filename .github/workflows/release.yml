name: release

# 打 tag（v*）自动出安装包：Windows 走官方 runner（Linux 无法交叉编译 NSIS），
# Linux 走 ubuntu runner 出 deb，产物都上传到同名的 GitHub Release。
on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Windows 安装包（NSIS）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'mydict-desktop ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包（NSIS，x64）。其它平台见同一 Release 的附件。'
          releaseDraft: false
          prerelease: false
          # bundle.targets 配置里只有 deb（本地 Linux 构建）；Windows 上按参数改出 NSIS
          args: --bundles nsis

  # Linux 包（deb）——以前只在本地手搓、容易漏挂到 Release，这里一并自动化。
  # 固定 ubuntu-22.04：Tauri v2 官方文档的依赖包名以 22.04 为准
  # （24.04 上 libappindicator3-dev 已改名 libayatana-appindicator3-dev）。
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Linux 安装包（deb）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # bundle.targets 已配 deb，这里显式写出来免得将来改配置时静默漏掉
          args: --bundles deb
